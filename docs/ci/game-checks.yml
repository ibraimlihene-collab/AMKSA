name: Game checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run audit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: amksa-dist-${{ github.sha }}
          path: dist/
